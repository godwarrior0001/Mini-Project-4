name: Enterprise DevOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Extract Terraform Public IP Output
        id: tf_output
        run: |
          cd terraform
          IP=$(terraform output -raw app_server_public_ip)
          echo "SERVER_IP=$IP" >> $GITHUB_ENV

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}

      - name: Run Ansible Playbook Handshake
        env:
          SERVER_IP: ${{ env.SERVER_IP }}
        run: |
          cd ansible
          echo -e "[academic_servers]\nserver-host ansible_host=$SERVER_IP ansible_user=ubuntu" > hosts.ini
          ansible-playbook -i hosts.ini playbook.yml
